[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "reactor-agent"
version = "0.1.0"
description = "Correction-aware execution core for interruptible voice agents"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]
voice = ["livekit-agents==1.3.12", "livekit-plugins-google==1.3.12"]

[project.scripts]
reactor-demo = "reactor.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

